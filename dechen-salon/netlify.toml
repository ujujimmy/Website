# Netlify configuration for DECHEN Salon.
#
# In the Netlify UI, set **Base directory** to `dechen-salon` — this repository
# also contains a different site at its root, and without that setting Netlify
# would build the wrong one. Everything else is read from this file.
#
# The site is a static export (see next.config.ts), so there is no Next.js
# runtime, no serverless functions and no cold starts. Netlify just serves files.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack builds are quiet enough without the telemetry ping.
  NEXT_TELEMETRY_DISABLED = "1"

# ---------------------------------------------------------------------------
# Caching
#
# Everything under /_next/static is content-hashed, so it can be cached forever.
# The photographs are not hashed — a new image reuses its filename — so they get
# a day of caching and are then revalidated in the background.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # No third-party scripts, no analytics, no embeds — so the page needs none
    # of these capabilities.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# ---------------------------------------------------------------------------
# Clean URLs
#
# The static export writes `menu.html`, not `menu/index.html`. Netlify serves
# extensionless paths from those files on its own, but only while the "Pretty
# URLs" post-processing option is enabled — and it is a setting someone can turn
# off in the dashboard without realising it takes every page on the site with
# it. These make it explicit instead. Status 200 rewrites rather than 301s, so
# the address bar keeps the clean path.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/services/cuts-and-styling"
  to = "/services/cuts-and-styling.html"
  status = 200
[[redirects]]
  from = "/services/hair-color"
  to = "/services/hair-color.html"
  status = 200
[[redirects]]
  from = "/services/hair-extensions"
  to = "/services/hair-extensions.html"
  status = 200
[[redirects]]
  from = "/services/treatments"
  to = "/services/treatments.html"
  status = 200
[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/founder"
  to = "/founder.html"
  status = 200
[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200
[[redirects]]
  from = "/visit"
  to = "/visit.html"
  status = 200

# Anything else falls through to the exported 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
