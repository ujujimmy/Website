# Netlify configuration for DECHEN Salon.
#
# In the Netlify UI, set **Base directory** to `dechen-salon` — this repository
# also contains a different site at its root, and without that setting Netlify
# would build the wrong one. Everything else is read from this file.
#
# The site is a static export (see next.config.ts), so there is no Next.js
# runtime, no serverless functions and no cold starts. Netlify just serves files.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack builds are quiet enough without the telemetry ping.
  NEXT_TELEMETRY_DISABLED = "1"

# ---------------------------------------------------------------------------
# Caching
#
# Everything under /_next/static is content-hashed, so it can be cached forever.
# The photographs are not hashed — a new image reuses its filename — so they get
# a day of caching and are then revalidated in the background.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # No third-party scripts, no analytics, no embeds — so the page needs none
    # of these capabilities.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
